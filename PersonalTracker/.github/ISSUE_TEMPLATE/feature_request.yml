name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We appreciate your ideas for improving Personal Tracker.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: "I would like to be able to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or features?
      placeholder: "I also thought about..."
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) should this feature be available on?
      multiple: true
      options:
        - iOS
        - macOS
        - Both
        - watchOS (future)
        - visionOS (future)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical - I can't use the app without it
        - High - This would significantly improve my experience
        - Medium - Nice to have, but not essential
        - Low - Just an idea for the future
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe a specific use case or scenario where this feature would be valuable
      placeholder: "When I'm tracking my daily activities, I would use this feature to..."
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: Mockups or Examples
      description: If applicable, add mockups, screenshots, or examples from other apps
      placeholder: "Here's how I envision it looking..."
    validations:
      required: false

  - type: checkboxes
    id: alignment
    attributes:
      label: Privacy-First Alignment
      description: Does this feature align with Personal Tracker's privacy-first principles?
      options:
        - label: This feature maintains user privacy and local-first data storage
          required: true
        - label: This feature does not require sharing data with third parties
          required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you interested in contributing?
      options:
        - label: I would be willing to contribute this feature (with guidance)
          required: false
